<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elegir nueva contraseña - Editor de Video de Dematiu</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js?v=5"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">🎬 Editor de Video</h1>
      <p class="login-sub">Elegí tu nueva contraseña</p>

      <form id="resetForm">
        <div class="control-group">
          <label for="newPassword">Nueva contraseña</label>
          <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="control-group">
          <label for="newPassword2">Repetir contraseña</label>
          <input type="password" id="newPassword2" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn-primary login-submit" id="resetBtn">Guardar y entrar</button>
      </form>

      <p class="error hidden" id="resetError"></p>
      <p class="success-msg hidden" id="resetSuccess"></p>
    </div>
  </div>

  <script src="reset-password.js?v=5"></script>
  <script src="spotlight.js?v=5"></script>
</body>
</html>
