<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión - Editor de Video de Dematiu</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js?v=4"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">🎬 Editor de Video</h1>
      <p class="login-sub" id="loginSub">Ingresá con tu cuenta</p>

      <div class="login-tabs">
        <button type="button" class="login-tab active" data-tab="login">Iniciar sesión</button>
        <button type="button" class="login-tab" data-tab="register">Crear cuenta</button>
      </div>

      <button type="button" class="google-btn hidden" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.87-3.04.87-2.34 0-4.32-1.58-5.03-3.7H.95v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.73A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.19.29-1.73V4.94H.95A9 9 0 0 0 0 9c0 1.45.35 2.82.95 4.06l3.02-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.94l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continuar con Google
      </button>
      <div class="divider hidden" id="googleDivider"><span>o</span></div>

      <form id="loginForm">
        <div class="control-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" autocomplete="username" required>
        </div>
        <div class="control-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary login-submit" id="loginBtn">Ingresar</button>
        <button type="button" class="link-btn-inline" id="forgotLink">¿Olvidaste tu contraseña?</button>
      </form>

      <form id="forgotForm" class="hidden">
        <p class="login-sub" style="margin-bottom:16px;">Ingresá tu email y te mandamos un link para elegir una nueva contraseña.</p>
        <div class="control-group">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" autocomplete="username" required>
        </div>
        <button type="submit" class="btn-primary login-submit" id="forgotBtn">Enviar link</button>
        <button type="button" class="link-btn-inline" id="backToLoginLink">← Volver a iniciar sesión</button>
        <p class="success-msg hidden" id="forgotSuccess"></p>
      </form>

      <form id="registerForm" class="hidden">
        <div class="control-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" autocomplete="username" required>
        </div>
        <div class="control-group">
          <label for="registerPassword">Contraseña</label>
          <input type="password" id="registerPassword" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="control-group">
          <label for="registerPassword2">Repetir contraseña</label>
          <input type="password" id="registerPassword2" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="control-group">
          <label for="registerReferral">Código de invitación (opcional)</label>
          <input type="text" id="registerReferral" placeholder="Si alguien te invitó, ponelo acá">
        </div>
        <button type="submit" class="btn-primary login-submit" id="registerBtn">Crear cuenta</button>
      </form>

      <p class="error hidden" id="loginError"></p>
    </div>
  </div>

  <script src="login.js?v=4"></script>
  <script src="spotlight.js?v=4"></script>
</body>
</html>
