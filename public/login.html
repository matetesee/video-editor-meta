<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión - Editor de Video de Dematiu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">🎬 Editor de Video</h1>
      <p class="login-sub">Ingresá con tu usuario del equipo</p>

      <form id="loginForm">
        <div class="control-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="control-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary login-submit" id="loginBtn">Ingresar</button>
        <p class="error hidden" id="loginError"></p>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
